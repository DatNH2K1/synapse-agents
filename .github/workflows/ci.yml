name: CI Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - "**"

jobs:
  lint-and-check-portal:
    name: Lint & Check Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synapse-portal
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: synapse-portal/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint, Types & Other Checks
        run: npm run check

  test-portal:
    name: Test Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synapse-portal
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: synapse-portal/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Silent Tests
        run: npm run test:silent
